name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m pytest -q -k "not real_ffmpeg_render"
      - name: Linux FFmpeg integration test
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_render_integration.py
