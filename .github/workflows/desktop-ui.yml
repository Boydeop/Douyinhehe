name: Desktop UX smoke and snapshots
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ux:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      DOUYINHEHE_HOME: ${{ runner.temp }}/DouyinheheUXTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install only minimal GUI dependencies
        shell: pwsh
        run: |
          python -m pip install -e '.[gui]'
          if ($LASTEXITCODE -ne 0) { throw 'PySide6 GUI dependency install failed' }
      - name: Check native window and required callbacks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ux-preview | Out-Null
          python -m douyinhehe --ui-smoke-test --ui-smoke-file ux-preview/smoke.ok
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ux-preview/smoke.ok)) {
            throw 'Qt GUI smoke did not complete'
          }
      - name: Capture downloader and editor at both themes
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from douyinhehe.app import MainWindow
          output = Path("ux-preview")
          app = QApplication([])
          window = MainWindow()
          window.resize(1480, 920)
          window.show()
          app.processEvents()
          if not window.grab().save(str(output / "01-download-dark.png"), "PNG"):
              raise RuntimeError("Dark download capture failed")
          window.nav.setCurrentRow(2)
          app.processEvents()
          if not window.grab().save(str(output / "02-editor-dark.png"), "PNG"):
              raise RuntimeError("Editor capture failed")
          if window.theme_mode != "light":
              window.toggle_theme()
          window.nav.setCurrentRow(1)
          app.processEvents()
          if not window.grab().save(str(output / "03-download-light.png"), "PNG"):
              raise RuntimeError("Light download capture failed")
          window.close()
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw 'Qt screenshot generation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DouyinheheStudio-Native-UX
          path: ux-preview/*.png
          retention-days: 14
          if-no-files-found: error
