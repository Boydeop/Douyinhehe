name: Build Windows desktop EXE
on:
  push:
    branches: [main, 'release/v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install real FFmpeg binaries (not Chocolatey shims)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=9.0.2 --no-progress -y --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg installation failed' }
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $toolsDir = Join-Path $chocoRoot 'lib\ffmpeg\tools'
          if (-not (Test-Path $toolsDir)) { throw "Missing Chocolatey ffmpeg tools: $toolsDir" }
          $real = Get-ChildItem -Path $toolsDir -Filter 'ffprobe.exe' -Recurse -File |
            Where-Object { $_.Length -gt 1MB -and (Test-Path (Join-Path $_.DirectoryName 'ffmpeg.exe')) } |
            Select-Object -First 1
          if (-not $real) { throw 'Real ffprobe.exe not found (Chocolatey command shims cannot be bundled)' }
          $ffmpeg = Join-Path $real.DirectoryName 'ffmpeg.exe'
          New-Item -ItemType Directory -Force -Path vendor/bin | Out-Null
          Copy-Item -LiteralPath $ffmpeg -Destination vendor/bin/ffmpeg.exe -Force
          Copy-Item -LiteralPath $real.FullName -Destination vendor/bin/ffprobe.exe -Force
          & ./vendor/bin/ffprobe.exe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Copied ffprobe is not runnable' }
          & ./vendor/bin/ffmpeg.exe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Copied ffmpeg is not runnable' }
      - name: Build EXE with PyInstaller
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build isolated F2 channel worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .f2-build
          & ./.f2-build/Scripts/python.exe -m pip install --disable-pip-version-check 'f2==0.0.1.7' 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { throw 'F2 isolated dependency install failed' }
          & ./.f2-build/Scripts/python.exe -m PyInstaller --noconfirm --clean --onefile --console --name DouyinF2Worker --collect-all f2 scripts/f2_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'F2 worker PyInstaller failed' }
          & ./dist/DouyinF2Worker.exe --doctor
          if ($LASTEXITCODE -ne 0) { throw 'F2 worker smoke test failed' }
      - name: Bundle FFmpeg and credits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/DouyinhehePro/bin | Out-Null
          Copy-Item vendor/bin/ffmpeg.exe dist/DouyinhehePro/bin/ffmpeg.exe -Force
          Copy-Item vendor/bin/ffprobe.exe dist/DouyinhehePro/bin/ffprobe.exe -Force
          Copy-Item dist/DouyinF2Worker.exe dist/DouyinhehePro/bin/DouyinF2Worker.exe -Force
          Copy-Item docs/THIRD_PARTY.md dist/DouyinhehePro/THIRD_PARTY.md -Force
          Copy-Item docs/OCR_OFFLINE.md dist/DouyinhehePro/OCR_OFFLINE.md -Force
          & ./dist/DouyinhehePro/bin/ffmpeg.exe -buildconf | Out-File -Encoding utf8 dist/DouyinhehePro/FFMPEG_BUILDINFO.txt
          $ffmpegSource = "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
          "FFmpeg Chocolatey version: 9.0.2`nSource: $ffmpegSource`nActual build configuration: see FFMPEG_BUILDINFO.txt" |
            Out-File -Encoding utf8 dist/DouyinhehePro/FFMPEG_SOURCE.txt
          if (-not (Test-Path dist/DouyinhehePro/DouyinhehePro.exe)) { throw 'Missing EXE' }
      - name: Windows portable smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./dist/DouyinhehePro/bin/ffprobe.exe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe smoke test failed' }
          & ./dist/DouyinhehePro/bin/ffmpeg.exe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg smoke test failed' }
          # Three ONNX model assets must be physically present inside the portable folder.
          $models = @(Get-ChildItem -Path dist/DouyinhehePro -Recurse -Filter '*.onnx' -File)
          if ($models.Count -lt 3) { throw "Bundled OCR model assets missing (found $($models.Count))" }
          & ./dist/DouyinhehePro/DouyinhehePro.exe --ocr-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen OCR inference failed: never publish a broken offline OCR build' }
          & ./dist/DouyinhehePro/DouyinhehePro.exe --render-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen FFmpeg masked render failed' }
          & ./dist/DouyinhehePro/DouyinhehePro.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app self-test failed' }
          & ./dist/DouyinhehePro/bin/DouyinF2Worker.exe --doctor
          if ($LASTEXITCODE -ne 0) { throw 'Portable F2 worker unavailable' }
          & ./dist/DouyinhehePro/DouyinhehePro.exe --doctor
          if ($LASTEXITCODE -ne 0) { throw 'Packaged downloader diagnostics failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & ./dist/DouyinhehePro/DouyinhehePro.exe --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GUI layout smoke test failed' }
          $file = Get-Item dist/DouyinhehePro/DouyinhehePro.exe
          Write-Host "EXE size bytes: $($file.Length)"
      - name: Record release component inventory and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @'
          import hashlib
          import importlib.metadata
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("dist/DouyinhehePro")
          names = (
              "DouyinhehePro.exe", "bin/ffmpeg.exe", "bin/ffprobe.exe",
              "bin/DouyinF2Worker.exe",
          )
          files = {}
          for name in names:
              file = root / name
              if not file.is_file():
                  raise RuntimeError("Missing packaged component: " + name)
              digest = hashlib.sha256()
              with file.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files[name] = {
                  "sha256": digest.hexdigest(),
                  "bytes": file.stat().st_size,
              }
          packages = {}
          for name in ("PySide6", "PyInstaller", "yt-dlp", "rapidocr",
                       "onnxruntime", "Pillow", "faster-whisper", "f2"):
              try:
                  packages[name] = importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  packages[name] = "not in parent build environment"
          manifest = {
              "application": "DouyinhehePro",
              "version": "3.8.0rc1",
              "git_commit": os.environ.get("GITHUB_SHA", ""),
              "build_utc": datetime.now(timezone.utc).isoformat(),
              "platform": "Windows x64 portable onedir",
              "files": files,
              "build_package_versions": packages,
              "status": "Release candidate; live Douyin and commercial license approval pending",
          }
          (root / "BUILD_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          '@
          $source | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build manifest generation failed' }
          Copy-Item docs/PRODUCTION_GATE_V3_8.md dist/DouyinhehePro/PRODUCTION_GATE.md

      - name: ZIP portable release folder (streamed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          folder = Path("dist/DouyinhehePro")
          assert (folder / "DouyinhehePro.exe").is_file(), "EXE missing"
          with ZipFile("DouyinhehePro-Windows-x64.zip", "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for file in sorted(folder.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to("dist"))
          assert Path("DouyinhehePro-Windows-x64.zip").stat().st_size > 1000000
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP creation failed' }
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path DouyinhehePro-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  DouyinhehePro-Windows-x64.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DouyinhehePro-Windows-x64
          path: |
            DouyinhehePro-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on protected release branch
        if: startsWith(github.ref, 'refs/heads/release/v') && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}" -replace '^release/', ''
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          gh release create $tag DouyinhehePro-Windows-x64.zip SHA256SUMS.txt `
            --target "${{ github.sha }}" --title "Douyinhehe Pro $tag · Windows x64" `
            --notes-file docs/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }
      - name: Try updating public repo description and topics
        if: startsWith(github.ref, 'refs/heads/release/v') && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = @{description='Windows video affiliate studio: licensed Douyin, FFmpeg, Vietnamese subtitles and scheduling';topics=@('ffmpeg','pyside6','subtitle','affiliate','vietnamese')} | ConvertTo-Json -Compress
          $body | gh api -X PATCH "repos/${{ github.repository }}" --input -
          if ($LASTEXITCODE -ne 0) { Write-Warning 'GITHUB_TOKEN lacks repository Administration write; set metadata manually in repository Settings/About.' }
