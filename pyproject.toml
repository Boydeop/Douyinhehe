[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyinhehe"
version = "2.1.0"
description = "Vietnamese desktop studio for licensed Douyin video affiliate workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Douyinhehe contributors"}]
dependencies = ["Pillow>=10,<13", "httpx>=0.27,<1", "keyring>=25,<27"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
download = ["yt-dlp>=2025.1.1"]
gemini = ["google-genai>=1.0,<4"]
asr = ["faster-whisper>=1.1,<3"]
tts = ["pyttsx3>=2.9,<3"]
all = ["PySide6>=6.8,<7", "yt-dlp>=2025.1.1", "google-genai>=1.0,<4", "faster-whisper>=1.1,<3", "pyttsx3>=2.9,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.15,<2"]

[project.scripts]
douyinhehe = "douyinhehe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
